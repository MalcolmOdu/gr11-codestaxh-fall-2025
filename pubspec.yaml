name: codestaxh
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.3
  firebase_core: ^3.1.0
  go_router: ^16.2.5
  hive_ce: ^2.15.0
  hive_ce_flutter: ^2.3.2
  uuid: ^4.5.1
  flutter_highlight: ^0.7.0
  http: ^1.2.0
  cloud_firestore: ^5.5.0
  firebase_auth: ^5.3.3
  google_sign_in: ^6.2.2
  flutter_native_splash: ^2.4.1

flutter_native_splash:
  color: "#0A0E27"
  image: codestaxh-icon.png
  color_dark: "#0A0E27"
  image_dark: codestaxh-icon.png

  android_12:
    color: "#0A0E27"
    image: codestaxh-icon.png

  web: true
  android: true
  ios: true

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  hive_ce_generator: ^1.9.3
  build_runner: ^2.7.1
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
    background_color: "#0A0E27"
    theme_color: "#00D9FF"
  image_path: "codestaxh-icon.png"
  adaptive_icon_background_color: "#0A0E27"
  adaptive_icon_foreground_color: "codestaxh-icon.png"


flutter:
  uses-material-design: true

  assets:
    - assets/google_logo.png
    - assets/github_logo.png
    - assets/codestaxh-icon.png